name: Build binaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Roboto fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-roboto

      - run: go test ./...

      - run: mkdir -p dist

      - name: Build Windows x64
        run: go build -o dist/video-overlay-cli-windows-amd64.exe ./cmd/video-overlay-cli
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64

      - name: Build macOS Apple Silicon
        run: go build -o dist/video-overlay-cli-darwin-arm64 ./cmd/video-overlay-cli
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64

      - name: Build Linux x64
        run: go build -o dist/video-overlay-cli-linux-amd64 ./cmd/video-overlay-cli
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64

      - uses: actions/upload-artifact@v7
        with:
          name: video-overlay-cli-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  release:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: video-overlay-cli-${{ github.ref_name }}
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
          fi
